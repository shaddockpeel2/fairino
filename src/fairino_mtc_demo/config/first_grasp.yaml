fr3c_first_grasp:
  ros__parameters:
    arm_group: fairino3mt_v6_group
    base_frame: base_link
    tip_frame: grasp_frame
    gripper_joint: gripper_command_joint
    gripper_action: /ydi_j22_gripper_controller/gripper_cmd

    target_pose_topic: /perception/blue_cube_localizer/top_pose
    target_valid_topic: /perception/blue_cube_localizer/valid
    target_status_topic: /perception/blue_cube_localizer/status
    target_size_topic: /perception/blue_cube_localizer/object_size
    perception_reset_service: /perception/blue_cube_localizer/reset
    perception_skip_service: /perception/blue_cube_localizer/skip_current_sort_target
    # Stage-2 color actions use this service to invalidate old samples and bind
    # the next stable snapshot to an explicit color/filter generation.
    perception_color_service: /perception/blue_cube_localizer/set_target_color
    # Captured from live /joint_states at the sort-area observation posture on
    # 2026-09-24. Joint order is joint1 through joint6 (radians).
    sort_area_observation_joints_rad: [-0.4448582234913893, -1.4926392067037961, -1.1803526762233605, -2.1040482623964056, 1.5720227124768782, 0.10476253214466917]

    # Placement geometry is not set here. first_grasp.launch.py reads the
    # projected A4 grid and injects, for every calibrated region:
    #   place_<color>_center_m / place_<color>_slots_m  (pick_sort colours)
    #   place_zone_<region>_center_m / place_zone_<region>_slots_m (pick_place)
    #   place_zone_names                                (list of zones)
    # pick_place therefore never depends on the detected colour.

    # In colors execution mode, /start_continuous keeps selecting targets until
    # perception confirms that no actionable cube has remained for 10 seconds.
    batch_empty_timeout_s: 10.0
    # Match a re-observed source/output cube to the item already handled by the
    # current batch. This is smaller than one 30 mm cube centre spacing.
    batch_target_match_distance_m: 0.025

    # P3 keeps tracking and updating its latest stable target. /start accepts
    # only a currently valid/fresh target and copies it once; later camera
    # updates cannot change the target of an accepted grasp.

    # P3/P4 validated first-grasp geometry, in metres.
    approach_clearance_m: 0.010
    # Shared by pick_hold, pick_sort, pick_place, pick_stack, pick_stack_auto,
    # and the legacy start/batch services. A shallower contact depth leaves
    # table clearance for the lower finger corner when the tool is tilted.
    grasp_depth_m: 0.010
    grasp_tilt_candidates_rad:
      - 0.0
      - 0.17453292519943295
      - -0.17453292519943295
      - 0.3490658503988659
      - -0.3490658503988659
      - 0.5235987755982988
      - -0.5235987755982988
    # Reject an unreachable candidate with seeded IK, then give its collision
    # path one short OMPL attempt. The first complete route wins. These limits
    # apply only to candidate prevalidation; real execution replans keep the
    # normal planning_time_s/planning_attempts below.
    candidate_planning_time_s: 0.25
    candidate_planning_attempts: 1
    candidate_ik_timeout_s: 0.05
    # Vector from grasp_frame/TCP to the intended physical finger contact point,
    # expressed in grasp_frame. Zero preserves the calibrated TCP-centred grasp.
    grasp_contact_offset_xyz_m: [0.0, 0.0, 0.0]
    lift_distance_m: 0.050
    # Sorting: attached cube bottom is 5 mm above the A4 region plane when
    # release is commanded. TCP is higher by the cube geometry offset.
    release_bottom_gap_m: 0.005
    # pick_place only. A calibrated zone slot counts as occupied when a known
    # MoveIt obstacle lies within this horizontal distance of it. The value also
    # sets the spacing that keeps two 30 mm cubes from overlapping a slot.
    zone_slot_clearance_m: 0.025
    pre_open_position_m: 0.060
    close_position_m: 0.027
    # The hardware has no aperture feedback. Send one bounded, bench-validated
    # 0.8 s open burst before arm motion. Repeating the same open command made
    # the fingers visibly hunt and added about 2.3 s before the arm could move.
    pre_open_command_repetitions: 1
    # The driver is open-loop, so action success confirms only that a PWM burst
    # was sent. At the stationary placement pose, send two independent open
    # bursts and wait for both before scene detach and arm retreat. Never close
    # between them: closing could re-grip or displace the placed cube.
    release_command_repetitions: 2
    # P3 publishes either [30, 30, 30] mm or [60, 30, 30] mm together with
    # the pose. This fallback is used only when use_target_size=false.
    object_size_m: [0.060, 0.030, 0.030]
    use_target_size: true
    # Nominal top-size aspect at or below this value gets square (90-degree)
    # yaw symmetry; larger values get rectangle (180-degree) symmetry.
    square_aspect_ratio_max: 1.10

    # Exact base-Z-down candidate: RPY ~= [pi, 0, pi]. During P4 the current
    # measured tool pose was close to this at [-2.997, 0.000, -3.113] rad.
    # This remains the exact vertical-down nominal orientation. Visual target
    # yaw is composed on top of it while roll/pitch remain constrained.
    grasp_orientation_xyzw: [0.0, 1.0, 0.0, 0.0]
    use_target_yaw: true
    # P3 target X is a selected top edge. Rotating the nominal grasp by
    # (object_yaw - 90 deg) aligns gripper Y with that edge and its X closing
    # axis across the perpendicular 30 mm dimension.
    target_yaw_offset_rad: -1.5707963267948966
    # Fallback symmetry used only when use_target_size=false. With dynamic
    # size enabled, cubes use pi/2 and rectangular boxes use pi.
    target_yaw_symmetry_rad: 3.141592653589793
    maximum_target_tilt_rad: 0.087266463

    # Tight first-run bounds around the P4 test area. Adjust deliberately when
    # the cube is moved to another part of the measured table.
    target_x_bounds_m: [-1.0, 1.00]
    # Expanded after the second physical placement was reacquired at
    # Y=-0.4726 m. Keep a narrow margin around the two proven test positions.
    target_y_bounds_m: [-1.00, -0.10]
    target_top_z_bounds_m: [0.025, 0.50]

    # Manual XYZ tool motion from the GUI. These bounds are an early gate only;
    # MoveIt must still find a complete collision-free path before execution.
    manual_pose_x_bounds_m: [-0.45, 0.45]
    manual_pose_y_bounds_m: [-0.80, -0.10]
    manual_pose_z_bounds_m: [0.12, 0.65]
    manual_pose_ik_timeout_s: 0.25

    cube_id: target_cube
    # pick_stack only. The lower cube stays in the planning scene for the whole
    # task under this virtual obstacle ID, which is cleared when the task ends.
    stack_support_id: stack_support_cube
    # pick_stack only. A square top face gives four equivalent grasps of the
    # upper cube, one whole yaw-symmetry step (90 degrees) apart. Aligning the
    # upper cube with the lower one requires rotating the wrist by the difference
    # between the two measured yaws reduced by whole 90 degree symmetry steps.
    # The nearest equivalent is therefore never more than 45 degrees away. A
    # candidate above this allowance is refused; if every candidate is refused
    # the pair is reported unstackable while the arm is still at home.
    maximum_stack_placement_rotation_rad: 0.7853981633974483
    # pick_stack only. The approach and retreat have to clear the lower cube
    # while the wrist rotates, so they stand higher than a table placement.
    stack_approach_clearance_m: 0.030
    # pick_stack only. Before motion both requested cubes must sit side by side
    # on the tabletop. Their independently estimated bottom heights may differ
    # by at most this tolerance. A support cube that is already the top of a
    # tower is exempt: its bottom is one cube height higher per stacked cube,
    # and its tier is checked against the height it is measured at instead.
    stack_height_tolerance_m: 0.012
    # pick_stack only. Horizontal radius that counts as "sitting on top of".
    stack_footprint_tolerance_m: 0.020
    # pick_stack only. Cubes per tower, counting the cube that stays on the
    # table. One request adds exactly one cube, so a four-cube tower is built by
    # calling pick_stack again with the cube the previous call left on top as
    # the new support colour. The perception node has to offer one
    # stacking_cube_height_offsets_m entry per stacked tier, that is
    # maximum_stack_cubes - 1 entries in
    # fr3c_camera/config/blue_cube_localizer.yaml; with fewer entries the top of
    # a tall tower is not recognised as a cube and the next request fails at
    # target acquisition instead of stacking.
    maximum_stack_cubes: 4
    # RViz Grid is the base_link XY plane at Z=0. MoveIt cannot collide with
    # an RViz display directly, so the task adds a 2 x 2 m collision slab just
    # below it. The 0.01 mm offset lets the fixed robot base sit on the plane
    # without allowing a task path to cross below it.
    ground_plane_id: rviz_ground_plane
    ground_plane_z_m: 0.0
    ground_plane_xy_size_m: [2.0, 2.0]
    ground_plane_thickness_m: 0.020
    ground_plane_contact_epsilon_m: 0.00001
    # P4 top Z 0.03546 m gives cube bottom Z 0.00546 m. Keep accepting that
    # measured offset while refusing a cube below or implausibly far above the plane.
    maximum_cube_plane_gap_m: 0.010
    touch_links:
      - gripper_finger_px_py_link
      - gripper_finger_px_ny_link
      - gripper_finger_nx_py_link
      - gripper_finger_nx_ny_link

    # First-stage speed increase: keep acceleration conservative to limit
    # start/stop shock and carried-block oscillation.
    velocity_scale: 0.075
    acceleration_scale: 0.065
    planning_time_s: 10.0
    planning_attempts: 5
    cartesian_step_m: 0.001
    # Disable MoveIt's relative-average jump heuristic and apply the explicit
    # absolute per-sample joint-step limit below. Collision checking stays on.
    cartesian_jump_threshold: 0.0
    maximum_cartesian_joint_step_rad: 0.10
    # Execute prevalidated placement descent/retreat only when every arm joint
    # is still within this distance of that trajectory's checked start state.
    validated_segment_start_tolerance_rad: 0.010
    minimum_cartesian_fraction: 0.999999
    target_message_timeout_s: 1.0
    # Includes a fresh RGB-D frame and the configured perception stability window.
    target_acquisition_timeout_s: 4.0
    arrival_position_tolerance_m: 0.003
    arrival_orientation_tolerance_rad: 0.034906585
    action_timeout_s: 12.0
    state_timeout_s: 3.0
    gripper_state_tolerance_m: 0.003
    log_directory: /home/industio/fairino_ws/evidence/P5/runs
    # execute=true initially requires a fresh passing P6 gate for the MoveIt
    # joint ServoJ path. Once accepted, that exact gate remains valid for this
    # P5 process; stack restart invalidates it and requires a new startup P6.
    p6_gate_file: /home/industio/fairino_ws/evidence/P6/p6_execution_gate.txt
    # 100-hour freshness limit for accepting a new gate. This is not a timeout
    # on a gate already accepted by the running P5 process.
    p6_gate_max_age_s: 360000.0
