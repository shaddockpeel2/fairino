# DaBai DCW2 15 FPS variant without the optional RViz point cloud.
# Identical to dabai_dcw2.yaml except both stream FPS. Not a runtime default; kept for
# bench comparison against dabai_dcw2.yaml.
# Measured 2026-09-22: color 13.67 FPS, depth 12.15 FPS. Disabling the point cloud did not
# change the result, so the point cloud is unlikely to be the main bottleneck.
# See docs/hardware/DaBai_DCW2_接入说明.md section 6.
camera_name: camera
serial_number: CH82C5201C9
camera:
  camera_name: camera
  serial_number: CH82C5201C9
  device_num: 2
  color_width: 640
  color_height: 480
  color_fps: 15
  color_format: MJPG
  enable_color: true
  color_qos: SENSOR_DATA
  color_camera_info_qos: SENSOR_DATA
  depth_width: 640
  depth_height: 400
  depth_fps: 15
  depth_format: Y11
  enable_depth: true
  depth_qos: SENSOR_DATA
  depth_camera_info_qos: SENSOR_DATA
  enable_ir: false
  depth_registration: true
  align_mode: HW
  enable_frame_sync: false
  frame_aggregate_mode: full_frame
  enable_point_cloud: false
  enable_colored_point_cloud: false
  publish_tf: true
  tf_publish_rate: 0.0
  enable_soft_filter: false
  enable_ldp: false
  enable_heartbeat: false
  time_domain: system
  log_level: warn
