/perception/blue_cube_localizer:
  ros__parameters:
    # These are the D2C streams produced by dabai_dcw2*.yaml. Raw, unregistered
    # depth must not be substituted.
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    color_info_topic: /camera/color/camera_info
    depth_info_topic: /camera/depth/camera_info
    joint_state_topic: /joint_states
    base_frame: base_link
    expected_optical_frame: camera_color_optical_frame
    expected_camera_serial: CH82C5201C9

    # Required at launch. The node also compares the online flange->camera_link
    # transform against this accepted calibration before emitting a valid pose.
    hand_eye_file: ''
    tcp_file: ''

    # Five TCP-contact pairs measured the visual top 3.59..5.36 mm high
    # (median 5.15 mm). Apply a conservative signed correction in base_link.
    # Negative lowers the published/accepted top pose; set 0.0 to disable.
    top_pose_z_compensation_m: -0.004

    # Supported object-frame X/Y/Z dimensions. Classification uses top-point
    # axis ratio, then publishes the matching nominal size with the pose.
    cube_size_m: [0.030, 0.030, 0.030]
    rectangular_box_size_m: [0.060, 0.030, 0.030]
    visual_yaw_enabled: true
    # Used only when visual_yaw_enabled=false.
    fixed_yaw_rad: 0.0
    # Perspective and partial depth edges can stretch a real 30 mm cube top.
    # Keep a fail-closed ambiguity band before the 60 x 30 mm box threshold.
    cube_max_axis_ratio: 1.40
    rectangle_min_axis_ratio: 1.55
    stable_yaw_std_rad: 0.087266463  # 5 degrees across the accepted window
    max_sample_yaw_jump_rad: 0.34906585  # restart after a 20 degree jump

    max_age_s: 0.80
    max_skew_s: 0.10
    tf_timeout_s: 0.12
    sample_period_s: 0.18
    hand_eye_translation_tolerance_m: 0.0005
    hand_eye_rotation_tolerance_rad: 0.002
    tcp_translation_tolerance_m: 0.00001
    tcp_rotation_tolerance_rad: 0.00001

    # OpenCV hue range is 0..179. These defaults match the current dark-blue
    # test cube while retaining useful saturation/value headroom.
    hue_min: 90
    hue_max: 135
    saturation_min: 80
    value_min: 35
    morphology_size: 3
    # Four-color mode uses disjoint hue bands; tune these against the actual
    # camera image/lighting before hardware execution. Red spans HSV hue 0/179.
    red_hue_intervals: [0, 10, 170, 179]
    green_hue_intervals: [40, 85]
    blue_hue_intervals: [90, 135]
    yellow_hue_intervals: [18, 34]
    # In colors mode, only count square tops at cube height above this plane.
    # Background color patches on the paper/table remain visible in debug,
    # but cannot compete with a physical cube. Match the P5 ground plane.
    sorting_plane_z_m: 0.0
    sorting_max_cube_plane_gap_m: 0.010
    # Allow millimetre-scale depth/calibration error below the nominal plane.
    sorting_max_cube_plane_penetration_m: 0.002
    # P2 stacking. One entry per supported stacked tier: a cube whose top sits
    # (k + 1) cube heights above the plane is reported as tier k, so this list
    # is what pick_stack consumes as "the tower may be this tall". Three entries
    # make a four-cube tower detectable; a shorter list silently caps the tower
    # height the planner can see. Only the top cube of a tower is visible, so it
    # is the tier that identifies how much is already underneath it. The
    # tolerance is wider than sorting_max_cube_plane_gap_m on purpose: the
    # expected height of tier k accumulates k independent cube-height estimates.
    # Empty list disables stack-tier detection.
    stacking_cube_height_offsets_m: [0.030, 0.060, 0.090]
    stacking_tier_tolerance_m: 0.012
    # A batch planning failure excludes only the same color target within this
    # small XY radius, allowing the selector to continue with other cubes.
    sorting_skip_radius_m: 0.025
    min_area_px: 120.0
    max_area_px: 12000.0
    min_aspect_ratio: 0.45
    max_aspect_ratio: 2.8
    min_solidity: 0.72
    min_rectangularity: 0.55
    interior_fraction: 0.23

    min_depth_m: 0.15
    max_depth_m: 1.50
    min_depth_valid_fraction: 0.55
    top_quantile: 65.0
    top_tolerance_m: 0.006
    min_top_points: 30
    # This broad check accepts both supported 30 x 30 and 60 x 30 mm tops.
    # The interval includes mask erosion, occlusion and RGB-D uncertainty.
    min_observed_side_m: 0.014
    max_observed_side_m: 0.075
    max_top_z_spread_m: 0.010

    # Tighten these to the measured table/workspace before P5 is allowed to
    # consume the target.
    workspace_x: [-1.0, 1.0]
    workspace_y: [-1.0, 1.0]
    workspace_z: [-0.10, 1.20]

    robot_joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    joint_state_max_age_s: 0.25
    stationary_window_s: 0.40
    stationary_joint_span_rad: 0.001
    stable_samples: 3
    stable_xy_std_m: 0.003
    stable_z_std_m: 0.003
    # A few rejected frames do not discard progress. A longer gap or a target
    # jump starts a new rolling window, so old and new object positions cannot mix.
    stable_sample_max_gap_s: 1.20
    max_sample_jump_m: 0.020

    # Select one independent target-detection scene at startup. All modes use
    # the same registered-depth localization and grasp topics. YOLO's bundled
    # garbage model recognizes 16 labelled waste classes, not a generic cube.
    detection_mode: blue
    yolo_model_path: ''
    yolo_confidence_threshold: 0.25
    yolo_iou_threshold: 0.45
    yolo_core_mode: core0
