# Astra device-side diagnostic: inspect raw IR together with unregistered depth.
camera_name: camera
serial_number: AY23B520016
camera:
  camera_name: camera
  serial_number: AY23B520016
  device_num: 2
  enable_color: false
  depth_width: 640
  depth_height: 400
  depth_fps: 30
  depth_format: Y11
  enable_depth: true
  depth_qos: SENSOR_DATA
  depth_camera_info_qos: SENSOR_DATA
  ir_width: 640
  ir_height: 400
  ir_fps: 30
  ir_format: Y10
  enable_ir: true
  ir_qos: SENSOR_DATA
  ir_camera_info_qos: SENSOR_DATA
  depth_registration: false
  enable_frame_sync: false
  enable_point_cloud: false
  enable_colored_point_cloud: false
  publish_tf: true
  tf_publish_rate: 0.0
  enable_soft_filter: false
  enable_ldp: true
  enable_heartbeat: false
  time_domain: system
  log_level: warn
