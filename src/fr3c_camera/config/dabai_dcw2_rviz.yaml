# DaBai DCW2 visualization profile.
# Keep dabai_dcw2.yaml unchanged as the validated production baseline.
camera_name: camera
serial_number: CH82C5201C9
camera:
  camera_name: camera
  serial_number: CH82C5201C9
  device_num: 2
  color_width: 640
  color_height: 480
  color_fps: 10
  color_format: MJPG
  enable_color: true
  color_qos: SENSOR_DATA
  color_camera_info_qos: SENSOR_DATA
  depth_width: 640
  depth_height: 400
  depth_fps: 10
  depth_format: Y11
  enable_depth: true
  depth_qos: SENSOR_DATA
  depth_camera_info_qos: SENSOR_DATA
  enable_ir: false
  depth_registration: true
  align_mode: HW
  enable_frame_sync: false
  frame_aggregate_mode: full_frame

  # Publish one RGB-coloured cloud. Publishing the XYZ-only cloud as well would
  # perform a second point-cloud conversion for the same depth frame.
  enable_point_cloud: false
  enable_colored_point_cloud: true
  point_cloud_qos: SENSOR_DATA
  ordered_pc: false

  publish_tf: true
  tf_publish_rate: 0.0
  enable_soft_filter: false
  enable_ldp: false
  enable_heartbeat: false
  time_domain: system
  log_level: warn
