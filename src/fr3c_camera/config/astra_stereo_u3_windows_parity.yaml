# Match the successful Windows camera_retest.py stream contract on ARM.
# RGB 640x480@30 + raw Depth 640x400@30, then software D2C to RGB geometry.
camera_name: camera
serial_number: AY23B520016
camera:
  camera_name: camera
  serial_number: AY23B520016
  device_num: 2
  color_width: 640
  color_height: 480
  color_fps: 30
  color_format: MJPG
  enable_color: true
  color_qos: SENSOR_DATA
  color_camera_info_qos: SENSOR_DATA
  depth_width: 640
  depth_height: 400
  depth_fps: 30
  depth_format: Y11
  enable_depth: true
  depth_qos: SENSOR_DATA
  depth_camera_info_qos: SENSOR_DATA
  enable_ir: false
  depth_registration: true
  align_mode: SW
  enable_frame_sync: false
  frame_aggregate_mode: full_frame
  enable_point_cloud: false
  enable_colored_point_cloud: false
  publish_tf: true
  tf_publish_rate: 0.0
  enable_soft_filter: false
  enable_ldp: true
  enable_heartbeat: false
  time_domain: system
  log_level: warn
