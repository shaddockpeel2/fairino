# DaBai DCW2 runtime camera profile (grasp / MoveIt / RViz). 15 FPS request.
# Identical to dabai_dcw2_rviz.yaml except both stream FPS.
# The device only offers 5/10/15/20/25/30 FPS, so 12 is not selectable; requesting 10
# yields only ~9, while requesting 15 yields ~13.5 color and ~12.6 depth. Measured
# 2026-09-22 on the current USB 2.0 link (D2C on, colored point cloud on):
#   color 13.53 FPS, depth 12.58 FPS, 691 aligned pairs/60 s, 94.3% valid depth
#   (10 FPS baseline: 9.80/9.05, 531 pairs, 95.6% valid)
# The USB 2.0 path and D2C scheduling may contribute to the shortfall from 15.
# A faster host port alone does not guarantee a faster camera connection.
camera_name: camera
serial_number: CH82C5201C9
camera:
  camera_name: camera
  serial_number: CH82C5201C9
  device_num: 2
  color_width: 640
  color_height: 480
  color_fps: 15
  color_format: MJPG
  enable_color: true
  color_qos: SENSOR_DATA
  color_camera_info_qos: SENSOR_DATA
  depth_width: 640
  depth_height: 400
  depth_fps: 15
  depth_format: Y11
  enable_depth: true
  depth_qos: SENSOR_DATA
  depth_camera_info_qos: SENSOR_DATA
  enable_ir: false
  depth_registration: true
  align_mode: HW
  enable_frame_sync: false
  frame_aggregate_mode: full_frame

  enable_point_cloud: false
  enable_colored_point_cloud: true
  point_cloud_qos: SENSOR_DATA
  ordered_pc: false

  publish_tf: true
  tf_publish_rate: 0.0
  enable_soft_filter: false
  enable_ldp: false
  enable_heartbeat: false
  time_domain: system
  log_level: warn
