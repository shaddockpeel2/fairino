# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # 125 Hz = 8 ms, matching the V3.9.2 FAIRINO ROS 2 ServoJ cmdT used below.
    update_rate: 125  # Hz

    # Kept inactive while the robot is idle. The trajectory bridge activates
    # it only for the lifetime of a MoveIt execution goal.
    fairino3mt_execution_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Dedicated continuous-position backend for MoveIt Servo.  It is spawned
    # inactive and is never active at the same time as the trajectory
    # controller; trajectory_control_bridge owns every transition.
    fairino3mt_servo_position_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fairino3mt_execution_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      # Use the SDK's measured joint velocity as the interpolation start state.
      - velocity

fairino3mt_servo_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: position
