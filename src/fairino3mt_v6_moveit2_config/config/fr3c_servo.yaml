###############################################
# FR3-C MoveIt Servo configuration (stage 3)
###############################################
use_gazebo: false

command_in_type: speed_units
scale:
  linear: 0.01
  rotational: 0.10
  joint: 0.10

# The ServoJ path lags 20 ms single-point setpoints on this robot. 100 ms
# yielded repeatable sub-millimeter short pulses at the 0.005 m/s limit.
publish_period: 0.10
low_latency_mode: false
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin

# move_group owns the primary planning scene in the normal project launch.
is_primary_planning_scene_monitor: false
move_group_name: fairino3mt_v6_group
planning_frame: base_link
ee_frame_name: grasp_frame
robot_link_command_frame: base_link

incoming_command_timeout: 0.10
num_outgoing_halt_msgs_to_publish: 5

lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.08
leaving_singularity_threshold_multiplier: 2.0

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /fairino3mt_execution_controller/joint_trajectory

check_collisions: true
collision_check_rate: 10.0
# Fixed camera/gripper mounting pairs are handled by the SRDF allowed-collision
# matrix. Preserve conservative slowdown margins for all moving/self and world
# collision pairs.
self_collision_proximity_threshold: 0.010
scene_collision_proximity_threshold: 0.020
