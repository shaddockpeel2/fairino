# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Allow low-speed real-hardware trajectories enough time to settle before
# MoveIt cancels them. The previous defaults were trajectory*1.1 + 0.5 s.
trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 2.0

moveit_simple_controller_manager:
  controller_names:
    - fairino3mt_controller
    - ydi_j22_gripper_controller

  fairino3mt_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

  ydi_j22_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - gripper_command_joint
