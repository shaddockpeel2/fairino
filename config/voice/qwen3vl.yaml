schema_version: 1

assets:
  # Read-only P1-verified deployment root. Override with FR3C_QWEN_ASSET_ROOT.
  root: /home/industio/DofbotPro_JetsonNano_0106

model:
  id: qwen3-vl-2b-instruct-w8a8-rk3588
  vision_path: rknn-llm-main/examples/multimodal_model_demo/data/rknn/qwen3-vl_vision_rk3588.rknn
  language_path: rknn-llm-main/examples/multimodal_model_demo/data/rkllm/qwen3-vl-2b-instruct_w8a8_rk3588.rkllm

worker:
  binary_path: rknn-llm-main/examples/multimodal_model_demo/web/install/bin/qwen3_vl_worker
  rkllm_runtime_path: rknn-llm-main/examples/multimodal_model_demo/web/install/lib/librkllmrt.so
  rknn_runtime_path: rknn-llm-main/examples/multimodal_model_demo/web/install/lib/librknnrt.so
  transport: unix
  socket_name: qwen3vl-worker.sock
  # Half of the verified 4096 context. This is a ceiling, not a target length.
  max_new_tokens: 2048
  max_context_len: 4096
  npu_core_num: 1
  startup_timeout_s: 120
  request_timeout_s: 600
  cancel_grace_s: 0.25
  terminate_grace_s: 3
  max_prompt_bytes: 65536
  max_image_bytes: 10485760
  tools_enabled: false

service:
  runtime_directory: evidence/voice/P3/runtime
  trace_directory: evidence/voice/P3/runs
  socket_name: fr3c-qwen-service.sock
  auto_recover: true

coordination:
  perception_status_topic: /perception/blue_cube_localizer/status
  perception_control_service: /perception/blue_cube_localizer/set_inference_enabled
  grasp_status_topic: /fr3c_first_grasp/state
  pause_confirm_timeout_s: 3.0
  resume_confirm_timeout_s: 8.0
  status_stale_timeout_s: 2.5
  minimum_available_memory_mib: 512

dialogue:
  max_history_turns: 4
  # Includes the system prompt, retained turns and current question.
  max_history_prompt_bytes: 6000
  camera_topic: /camera/color/image_raw
  camera_max_age_s: 1.0
  capture_max_edge: 1280
  capture_jpeg_quality: 88
  max_saved_captures: 20

# Stage 10 reuses the previous project's verified immutable knowledge bundle.
# Override only the root with FR3C_KNOWLEDGE_ROOT when the assets are relocated.
knowledge:
  enabled: true
  root: /home/industio/DofbotPro_JetsonNano_0106/dofbot
  index_dir: knowledge/builds/current
  tokenizer_dir: RAG/weights/bge-small-zh-v1.5
  rknn_model_path: RAG/test/bge-small-zh-v1.5_seq128_int32_fp16_rk3588.rknn
  # Keep online retrieval small: exact search over 595 vectors, no vector DB.
  top_k: 4
  minimum_score: 0.45
  maximum_context_chars: 2200
  npu_core: "0"
  query_instruction: "为这个句子生成表示以用于检索相关文章："
